<!doctype html><meta name="robots" content="noindex"><title>Tutorial player QA</title><style>body{font:14px system-ui;background:#eef8ff}section{margin-bottom:20px}iframe{border:1px solid #89b7cc}pre{white-space:pre-wrap}</style><h1>Responsive player verification</h1><div id="cases"></div><script>
