<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>I Travel By My Own · Colaboradores</title>
<link rel="icon" href="/assets/img/favicon-32.png">
<link rel="stylesheet" href="/assets/css/itbmo-growth.css?v=297.7">
<link rel="stylesheet" href="/assets/css/itbmo-creator-portal.css?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap">

<script src="/assets/js/itbmo-creator-portal.js?v=3" defer></script>
</head>
<body>
<header class="g-header"><div class="g-header__inner creator-header">
<a class="g-brand" id="home" href="/"><img src="/assets/img/itbmo-logo-premium.webp" alt="I Travel By My Own" width="154" height="59"></a>
<div class="g-lang" id="language" role="group" aria-label="Idioma">
<button class="is-active" type="button" data-site-lang="es" lang="es" aria-pressed="true">ES</button>
<button type="button" data-site-lang="en" lang="en" aria-pressed="false">EN</button>
</div>
</div></header>
<main class="g-shell creator-main">
<section class="creator-intro">
<h1 id="title">Portal de <span class="g-gradient-text">colaboradores</span></h1>
<p id="intro">Encuentra tu enlace, las ventas con tu código y el estado de tus comisiones.</p>
</section>
<section class="card creator-access" id="access" aria-labelledby="access-title">
<h2 id="access-title">Accede a tu panel</h2>
<form id="login-form">
<fieldset id="login-fields" disabled>
<label><span id="email-label">Correo electrónico</span><input name="email" type="email" autocomplete="username" maxlength="254" required></label>
<label><span id="password-label">Contraseña</span><input name="password" type="password" autocomplete="current-password" required></label>
<button id="signin" class="g-button g-button--primary" type="submit">Iniciar sesión</button>
</fieldset>
</form>
</section>
<p id="notice" role="status"></p>
<section id="dashboard" hidden></section>
<section id="admin" class="card" hidden>
<h2 id="admin-title">Crear colaborador</h2>
<form id="creator-form">
<label><span data-field="name">Nombre visible</span><input name="name" maxlength="100" required></label>
<label><span data-field="code">Código</span><input name="code" autocomplete="off" minlength="3" maxlength="40" pattern="[A-Za-z0-9][A-Za-z0-9_\-]{2,39}" required></label>
<label><span data-field="email">Correo de la cuenta ITBMO verificada</span><input name="email" type="email" required></label>
<label><span data-field="payout_email">Correo PayPal Sandbox del colaborador</span><input name="payout_email" type="email" required></label>
<label><span data-field="discount">Descuento (%)</span><input name="discount" type="number" min="1" max="99" required></label>
<label><span data-field="commission">Comisión fija (centavos de USD)</span><input name="commission" type="number" min="1" max="798" required></label>
<button id="save" class="g-button g-button--primary">Crear colaborador</button>
<p id="admin-result" role="status"></p>
</form>
</section>
</main>
</body>
</html>
