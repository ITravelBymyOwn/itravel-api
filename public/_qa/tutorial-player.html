<!doctype html><html lang="en"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Tutorial viewport review</title><style>body{margin:0;padding:16px;background:#edf7fc;font:14px system-ui;color:#164269}header{display:flex;align-items:center;gap:12px;margin-bottom:14px}button{padding:9px 14px;border:1px solid #98c9dc;border-radius:9px;background:white;color:inherit;cursor:pointer}.views{display:flex;gap:22px;flex-wrap:wrap}figure{margin:0}figcaption{padding:8px;font-weight:700}iframe{display:block;width:390px;height:844px;border:2px solid #b4d6e4;border-radius:12px;background:white}</style><header><strong>Viewport review</strong><button data-size="390,844">Portrait 390 × 844</button><button data-size="844,390">Landscape 844 × 390</button></header><main class="views"><figure><figcaption>ES</figcaption><iframe id="es" title="Spanish tutorial viewport" src="/como-funciona?tutorial=2#tutoriales"></iframe></figure><figure><figcaption>EN</figcaption><iframe id="en" title="English tutorial viewport" src="/how-it-works?tutorial=2#tutoriales"></iframe></figure></main><script>document.querySelectorAll('[data-size]').forEach(b=>b.addEventListener('click',()=>{const [w,h]=b.dataset.size.split(',');document.querySelectorAll('iframe').forEach(f=>{f.style.width=w+'px';f.style.height=h+'px'});}));</script></html>
